[project]
name = "tradeops"
version = "1.0.0"
description = "Simulated trade order and settlement services for the Azure TradeOps platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "azure-identity>=1.19",
    "azure-data-tables>=12.6",
    "azure-servicebus>=7.13",
    "azure-monitor-opentelemetry>=1.6",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[sarif]>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running Azurite (set TRADEOPS_TEST_AZURITE=1)"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["tradeops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80  # unit-only floor; CI runs with Azurite and enforces 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "DTZ"]
ignore = ["S311"] # random is used for fault injection, not cryptography

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradeops"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["azure.monitor.opentelemetry.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
