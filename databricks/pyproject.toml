[project]
name = "tradeops-analytics"
version = "1.0.0"
description = "Settlement analytics transforms for the TradeOps Databricks bundle"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pyspark>=4.0,<5", "pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
