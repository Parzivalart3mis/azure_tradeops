# Local stack: the API with its ledger on Azurite (the Azure Storage emulator) and the
# in-process settlement queue. `docker compose up --build`, then http://localhost:8080/docs
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-table --tableHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck
    ports: ["10002:10002"]

  api:
    build:
      context: ./app
      args: { VERSION: "0.0.0-local", GIT_SHA: "local" }
    environment:
      TRADEOPS_ENVIRONMENT: local
      TRADEOPS_REVISION: local
      # Azurite's well-known development account; not a secret.
      TRADEOPS_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;" # gitleaks:allow
      TRADEOPS_FAULT_RATE: "${TRADEOPS_FAULT_RATE:-0}"
    ports: ["8080:8080"]
    depends_on: [azurite]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
